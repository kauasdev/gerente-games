<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Games</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 20px; }
    .campo { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .error-msg { color: red; font-size: 0.85em; margin: 5px 0 0; min-height: 1em; }
    fieldset { border: none; padding: 0; }
    .checkbox-group { border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
    button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer }
  </style>
</head>
<body>
<h2>Cadastro de Games</h2>
<form id="jogoForm" novalidate>
  <div class="campo">
    <label for="titulo">Titulo:</label>
    <input type="text" id="titulo" name="titulo" required maxlength="100" />
    <p id="err-titulo" class="error-msg"></p>
  </div>
  <div class="campo">
    <label for="anoDeLancamento">Ano de Lançamento:</label>
    <input type="text" id="anoDeLancamento" name="anoDeLancamento" required maxlength="64" />
    <p id="err-anoDeLancamento" class="error-msg"></p>
  </div>
  <div class="campo">
    <label for="plataforma">Plataforma:</label>
    <input type="text" id="plataforma" name="plataforma" required maxlength="100" />
    <p id="err-plataforma" class="error-msg"></p>
  </div>
  <div class="campo">
    <label for="disponivel">Disponibilidade:</label>
    <input type="text" id="disponivel" name="disponivel" maxlength="20" />
    <p id="err-disponivel" class="error-msg"></p>
  </div>
  <div class="campo">
    <label for="observacoes">Observações:</label>
    <input type="text" id="observacoes" name="observacoes" required />
    <p id="err-observacoes" class="error-msg"></p>
  </div>
  <button type="submit">Cadastrar Jogo</button>
</form>
<script>
  document.getElementById('jogoForm').addEventListener('submit', async (evt) => {
    evt.preventDefault();
    limparErros();
    const formEl = evt.target;
    // Monta o objeto com os dados do formulário
    const dados = {
      titulo: formEl.titulo.value,
      anoDeLancamento: formEl.anoDeLancamento.value,
      plataforma: formEl.plataforma.value,
      disponivel: formEl.disponivel.value,
      observacoes: formEl.observacoes.value,
    };
    try {
      const response = await fetch('/jogos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados),
      });
      if (!response.ok) {
        const dadosErros = await response.json();
        if (dadosErros.errors) {
          exibirErros(dadosErros.errors);
        }
        return;
      }
      alert('Cadastro realizado com sucesso!');
      formEl.reset();
    } catch (error) {
      alert('Não foi possível conectar ao servidor.');
    }
  });
  function limparErros() {
    document.querySelectorAll('.error-msg').forEach(p => p.textContent = '');
  }
  function exibirErros(erros) {
    // Bean Validation retorna: [{ "field": "email", "defaultMessage": "..." }, ...]
    for (const erro of erros) {
      const el = document.getElementById(`err-${erro.field}`);
      if (el) {
        el.textContent = erro.defaultMessage;
      }
    }
  }
</script>
</body>
</html>
