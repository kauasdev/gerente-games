<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Games</title>
</head>
<body>
<h1>Jogos</h1>
<section>
  <h2>Lista de Jogos</h2>
  <button id="btnListar">Carregar lista</button>
  <table>
    <thead>
    <tr>
      <th>ID</th><th>Titulo</th><th>AnoLançamento</th><th>Plataforma</th><th>Disponibilidade</th><th>Observações</th>
    </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
  </table>
</section>
<hr />
<section>
  <h2>Buscar Jogos pelo Titulo</h2>
  <button id="btnGta">Carregar GTA V</button>
  <button id="btnWatchDogs">Carregar Watch Dogs</button>
  <button id="btnSOTC">Carregar Shadow Of The Colossus</button>
  <article>
    <h3 id="nome">Nome</h3>
    <p>ID: <strong id="id"></strong></p>
    <p>Titulo: <strong id="titulo"></strong></p>
    <p>Ano de Lançamento: <strong id="anoDeLancamento"></strong></p>
    <p>Plataforma: <strong id="plataforma"></strong></p>
    <p>Disponibilidade: <strong id="disponivel"></strong></p>
    <p>Observações: <strong id="observacoes"></strong></p>
  </article>
</section>
<script>
  // Buscar e exibir a lista de jogo
  document.getElementById('btnListar').addEventListener('click', async () => {
    try {
      const httpResp = await fetch('/jogos');
      if (!httpResp.ok) {
        throw new Error('Erro HTTP ' + httpResp.status);
      }
      const jogos = await httpResp.json();
      const tbody = document.getElementById('corpoTabela');
      tbody.innerHTML = '';
      for (const p of jogos) {
        tbody.insertAdjacentHTML('beforeend',
          `<tr>
 <td>${p.id}</td>
 <td>${p.titulo}</td>
<td>${p.anoDeLancamento}</td>
 <td>${p.plataforma}</td>
 <td>${p.disponivel}</td>
  <td>${p.observacoes}</td>
 </tr>`
        );
      }
    } catch (err) {
      alert('Erro ao carregar lista: ' + err.message);
    }
  });
  // Buscar e exibir dados de uma jogo pelo titulo
  async function getJogo(titulo) {
    try {
      const httpResp = await fetch(`/jogos/${titulo}`);
      if (!httpResp.ok) {
        throw new Error('Erro HTTP ' + httpResp.status);
      }
      const p = await httpResp.json();
      document.getElementById('titulo').textContent = p.titulo;
      document.getElementById('id').textContent = p.id;
      document.getElementById('anoDeLancamento').textContent = p.anoDeLancamento;
      document.getElementById('plataforma').textContent = p.plataforma;
      document.getElementById('disponivel').textContent = p.disponivel;
      document.getElementById('observacoes').textContent = p.observacoes;
    } catch (err) {
      alert('Erro ao buscar jogo: ' + err.message);
    }
  }
  document.getElementById('btnGta').addEventListener('click', () => getJogo('Grand-Theft-Auto-V'));
  document.getElementById('btnWatchDogs').addEventListener('click', () => getJogo('Watch-Dogs'));
  document.getElementById('btnSOTC').addEventListener('click', () => getJogo('Shadow-Of-The-Colossus'));
</script>
</body>
</html>
